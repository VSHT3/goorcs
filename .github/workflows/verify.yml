name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GODOT_BIN: /opt/godot/Godot_v4.7.2-stable_linux.x86_64
      LIBGL_ALWAYS_SOFTWARE: "1"
      GALLIUM_DRIVER: llvmpipe
    steps:
      - uses: actions/checkout@v4
      - name: Install graphical runtime
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y xvfb xauth libgl1-mesa-dri libglx-mesa0 libx11-6 libxcursor1 libxinerama1 libxrandr2 libxi6 libasound2t64 libpulse0 libfontconfig1 libudev1 libvulkan1
      - name: Install required Godot release
        id: engine
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/godot.zip" https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          echo "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  $RUNNER_TEMP/godot.zip" | sha256sum --check --strict
          sudo mkdir -p /opt/godot
          sudo unzip -q "$RUNNER_TEMP/godot.zip" -d /opt/godot
          sudo chmod +x "$GODOT_BIN"
      - name: Headless verification
        run: python3 tools/verify.py headless
      - name: Rendered verification (Xvfb and Mesa software OpenGL)
        if: ${{ !cancelled() && steps.engine.outcome == 'success' }}
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" python3 tools/verify.py rendered
      - name: Upload failure logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: verification-logs
          path: .verify-logs/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
